[package]
name = "shift"
version = "1.0.0"
edition = "2021"
authors = ["Ensignsoft Mühendislik Ekibi", "Mustazafi"]
description = "Shift - High Performance Cloud & FTP/SFTP Transfer Client"

[dependencies]
async-channel = "2.3"
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
tokio = { version = "1.40", features = ["full"] }
suppaftp = { version = "5.3", features = ["native-tls"] }
ssh2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
url = "2.5"
once_cell = "1.19"
dirs = "5.0"
native-tls = "0.2"
